[mod]
id = "vastenchanting_native"
version = "0.1.0"
priority = 100

# The Horizon commit it was built and tested on.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The table's stats, offers, enchanting and screen.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "vastenchanting_client"
source = "client.rs"

# The table has a block entity...
[[injection]]
id = "be"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "h_be.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

# ...that ticks (its stats and offers)...
[[injection]]
id = "be-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "h_be_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "be-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "h_be_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# ...and holds two slots (the item and the lapis) shown by its own menu type.
[[injection]]
id = "be-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "h_be_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

# One item in the first slot, only lapis in the second.
[[injection]]
id = "slot-rules"
hook = "menu_slot_rules"
hook_version = 1
kind = "HEAD"
helper = "h_slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]

# An offer chosen: enchant or infuse, charge levels and lapis.
[[injection]]
id = "menu-button"
hook = "menu_button_v2"
hook_version = 1
kind = "HEAD"
helper = "h_menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]

# The screen: its layout, drawing, clicks and tooltips.
[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "h_screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "h_screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen-click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "h_screen_click.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "screen-tooltip"
hook = "screen_tooltip"
hook_version = 1
kind = "HEAD"
helper = "h_screen_tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "lines", ty = "&mut Vec<String>", value = "&mut *lines" },
]

# Shelves say what they give a table.
[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "h_tooltip.rs"
bindings = [
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "&mut *lines" },
]

# The mod's row in Options > Mods.
[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Tomes at the anvil: an enchanted item and a tome give a book with its enchantments (both sides work it out alike).
[[injection]]
id = "anvil"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_anvil_update"
helper = "h_anvil.rs"
bindings = [
  { name = "left", ty = "&horizon_client::items::ItemStack", value = "left" },
  { name = "right", ty = "Option<&horizon_client::items::ItemStack>", value = "right" },
  { name = "output", ty = "&mut Option<horizon_client::items::ItemStack>", value = "&mut *output" },
  { name = "xp_cost", ty = "&mut i32", value = "&mut *xp_cost" },
  { name = "material_cost", ty = "&mut i32", value = "&mut *material_cost" },
]

# A siphon tome's item comes back, plain and worn, once the book is taken.
[[injection]]
id = "anvil-taken"
hook = "anvil_craft_post"
hook_version = 1
kind = "HEAD"
helper = "h_anvil_taken.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "craft", ty = "&horizon_client::menu::AnvilCraft", value = "craft" },
]

# Our blocks drop themselves; a broken archive's item carries the enchantments it holds.
[[injection]]
id = "archive-drops"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_drops"
helper = "h_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "explosion", ty = "Option<f32>", value = "explosion" },
  { name = "drops", ty = "&mut Vec<ItemStack>", value = "&mut *drops" },
]

# The wheel scrolls the archive's list.
[[injection]]
id = "archive-wheel"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "h_wheel.rs"
bindings = [
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
