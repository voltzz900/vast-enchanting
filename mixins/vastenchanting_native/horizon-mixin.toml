[mod]
id = "vastenchanting_native"
version = "0.1.0"
priority = 100

# The Horizon commit it was built and tested on.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The table's stats, offers, enchanting and screen.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "vastenchanting_client"
source = "client.rs"

# The table has a block entity...
[[injection]]
id = "be"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "h_be.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

# ...that ticks (its stats and offers)...
[[injection]]
id = "be-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "h_be_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "be-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "h_be_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# ...and holds two slots (the item and the lapis) shown by its own menu type.
[[injection]]
id = "be-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "h_be_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

# One item in the first slot, only lapis in the second.
[[injection]]
id = "slot-rules"
hook = "menu_slot_rules"
hook_version = 1
kind = "HEAD"
helper = "h_slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]

# An offer chosen: enchant or infuse, charge levels and lapis.
[[injection]]
id = "menu-button"
hook = "menu_button_v2"
hook_version = 1
kind = "HEAD"
helper = "h_menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]

# The screen: its layout, drawing, clicks and tooltips.
[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "h_screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "h_screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen-click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "h_screen_click.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "screen-tooltip"
hook = "screen_tooltip"
hook_version = 1
kind = "HEAD"
helper = "h_screen_tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "lines", ty = "&mut Vec<String>", value = "&mut *lines" },
]

# Shelves say what they give a table.
[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "h_tooltip.rs"
bindings = [
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(Text, u32)>", value = "&mut *lines" },
]

# The mod's row in Options > Mods.
[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
